[package]
name = "zapret-gui"
version = "2.0.1"
edition = "2021"
description = "ZAPRET GUI: strategies (winws), TgWsProxy, system-wide proxy tunnel with kill switch"
publish = false

[[bin]]
name = "ZapretGUI"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
winreg = "0.52"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
]

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
